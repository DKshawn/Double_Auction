<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>実験の管理</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/teacher.css">
    <script type="module" src="/teacher.js"></script>
  </head>
  <body class="teacher-page">
    <a class="skip-link" href="#main" data-i18n="本文へ移動">本文へ移動</a>
    <header class="student-topbar"><span class="student-brand" data-i18n="実験の管理">実験の管理</span><div class="header-tools"><a href="/" data-i18n="学生ページ">学生ページ</a><div id="language-control"></div></div></header>
    <main id="main" class="teacher-main">
      <div class="teacher-heading"><h1 id="experiments-heading" data-i18n="実験を選択">実験を選択</h1><span id="classroom-status" role="status"></span></div>
      <p id="teacher-error" class="form-error" role="alert"></p>
      <section id="controls" aria-labelledby="experiments-heading"></section>
      <section class="teacher-students" aria-labelledby="students-heading">
        <div class="teacher-heading"><h2 id="students-heading" data-i18n="学生">学生</h2><div class="teacher-actions"><a class="button secondary" href="/api/export.csv?scope=students" download>CSV</a><a class="button secondary" href="/api/export.json?scope=students" download>JSON</a></div></div>
        <div id="records" aria-live="polite"><span data-i18n="読み込み中…">読み込み中…</span></div>
      </section>
    </main>
  </body>
</html>
